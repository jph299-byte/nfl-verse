name: Build 2025 DPI-adjusted yardage

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::nflreadr
            any::dplyr
            any::stringr

      - name: Build REG + POST DPI-adjusted yardage
        run: Rscript build_2025_dpi_yardage.R

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: 2025-dpi-adjusted-yardage
          path: |
            2025_dpi_adjusted_team_games.csv
            2025_dpi_audit.csv
            2025_dpi_summary.txt
          if-no-files-found: error
          retention-days: 90
