name: Replay corrected 2025 Yardage — recovered W1 ratings

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Verify required input files
        shell: bash
        run: |
          test -f replay_corrected_2025_yardage.R
          test -f pre_week1_2025_yardage_ratings.csv
          test -f pure_yardage_inputs_2025_2026w1-3.csv

      - name: Replay 2025 from recovered ratings
        run: Rscript replay_corrected_2025_yardage.R

      - name: Upload corrected replay
        uses: actions/upload-artifact@v4
        with:
          name: corrected-2025-yardage-replay-from-original-wk1
          path: |
            recovered_pre_week1_2025_ratings_used.csv
            corrected_2025_yardage_replay_audit.csv
            corrected_post_2025_yardage_ratings.csv
            corrected_2025_yardage_rating_snapshots.csv
            corrected_2025_yardage_replay_summary.txt
          if-no-files-found: error
