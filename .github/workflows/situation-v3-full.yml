name: Full Situation v3 rebuild

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Install R packages
        run: Rscript -e 'install.packages(c("nflreadr","dplyr","stringr"), repos="https://cloud.r-project.org")'
      - name: Rebuild 2025 calibration and 2026 Weeks 1-2
        run: Rscript situation_v3_full_rebuild.R
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: situation-v3-full-results
          path: situation_v3_full/
