name: Recalculate 2025 postseason second-down Situation

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install and verify R packages
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          install.packages("curl")
          install.packages(c("nflreadr", "dplyr", "stringr"))
          for (pkg in c("nflreadr", "dplyr", "stringr")) {
            if (!requireNamespace(pkg, quietly = TRUE)) stop("Missing package: ", pkg)
            cat(pkg, " installed and verified\n")
          }

      - name: Calculate both postseason variants
        run: Rscript rebuild_second_down_postseason_2025.R

      - name: Upload results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: second-down-postseason-2025-old-new
          path: second_down_replay_outputs/*.csv
          if-no-files-found: error
