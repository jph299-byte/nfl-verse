name: Recalculate 2025 postseason second-down Situation

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Install packages
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = 'https://cloud.r-project.org'))
          install.packages(c('nflreadr','dplyr','stringr'), dependencies=TRUE)
      - name: Calculate both postseason variants
        run: Rscript rebuild_second_down_postseason_2025.R
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: second-down-postseason-2025-old-new
          path: second_down_replay_outputs/*.csv
          if-no-files-found: error
