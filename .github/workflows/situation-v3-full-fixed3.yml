name: Full Situation v3 rebuild fixed3

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev
      - name: Install R packages
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          install.packages("curl")
          install.packages(c("nflreadr", "dplyr", "stringr"), dependencies = TRUE)
          stopifnot(requireNamespace("curl", quietly = TRUE))
          stopifnot(requireNamespace("nflreadr", quietly = TRUE))
          stopifnot(requireNamespace("dplyr", quietly = TRUE))
          stopifnot(requireNamespace("stringr", quietly = TRUE))
      - name: Rebuild and validate
        run: Rscript situation_v3_full_rebuild_fixed.R
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: situation-v3-full-results-fixed
          path: situation_v3_full/
          if-no-files-found: warn
