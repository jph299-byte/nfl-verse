name: Full Situation v3 rebuild

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R packages
        shell: Rscript {0}
        run: |
          install.packages(c("nflreadr", "dplyr", "stringr"),
                           repos = "https://cloud.r-project.org")
          stopifnot(requireNamespace("nflreadr", quietly = TRUE))
          stopifnot(requireNamespace("dplyr", quietly = TRUE))
          stopifnot(requireNamespace("stringr", quietly = TRUE))

      - name: Rebuild 2025 calibration and 2026 Weeks 1-2
        run: Rscript situation_v3_full_rebuild.R

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: situation-v3-full-results
          path: situation_v3_full/
          if-no-files-found: warn
