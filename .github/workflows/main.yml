name: Update NFL PBP

on:
  workflow_dispatch:
    inputs:
      week:
        description: "NFL week — leave blank for latest available"
        required: false
        type: string

  schedule:
    - cron: "0 10 * * 1,2,5"

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Convert and score NFL games
        run: |
          WEEK="${{ github.event.inputs.week }}"
          if [ -z "$WEEK" ]; then
            WEEK="auto"
          fi
          Rscript convert_week.R "$WEEK"

      - name: Read detected week
        id: detected
        shell: bash
        run: |
          WEEK=$(cat output_week.txt)
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"

      - name: Upload NFL Numbers outputs
        uses: actions/upload-artifact@v4
        with:
          name: week${{ steps.detected.outputs.week }}-exact-pbp
          path: |
            week${{ steps.detected.outputs.week }}_exact_results.csv
            week${{ steps.detected.outputs.week }}_results.js
            output/week*/
            csv/
          if-no-files-found: error
          retention-days: 90
