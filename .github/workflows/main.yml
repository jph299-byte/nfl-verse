name: Update NFL PBP

on:
  workflow_dispatch:
    inputs:
      week:
        description: "NFL week (leave blank for latest available week)"
        required: false
        type: string

  schedule:
    # 10:00 UTC Friday, Monday and Tuesday.
    # Friday captures TNF; Monday captures Sunday; Tuesday captures MNF.
    - cron: "0 10 * * 1,2,5"

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Determine requested week
        id: week
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.week }}" ]; then
            echo "week=${{ github.event.inputs.week }}" >> "$GITHUB_OUTPUT"
          else
            echo "week=auto" >> "$GITHUB_OUTPUT"
          fi

      - name: Convert and score NFL games
        run: Rscript convert_week.R "${{ steps.week.outputs.week }}"

      - name: Read detected week
        id: detected
        shell: bash
        run: |
          WEEK=$(cat output_week.txt)
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"

      - name: Upload NFL Numbers outputs
        uses: actions/upload-artifact@v4
        with:
          name: week${{ steps.detected.outputs.week }}-exact-pbp
          path: |
            week${{ steps.detected.outputs.week }}_exact_results.csv
            week${{ steps.detected.outputs.week }}_results.js
            csv/
          if-no-files-found: error
          retention-days: 90
