name: Update NFL PBP
on:
  workflow_dispatch:
    inputs:
      week:
        description: "NFL regular-season week (blank = latest available)"
        required: false
        type: string
  schedule:
    - cron: "0 10 * * 1,2,5"
permissions:
  contents: read
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install canonical engine dependencies
        run: Rscript -e 'install.packages(c("nflreadr", "dplyr", "stringr"), repos="https://cloud.r-project.org")'
      - name: Score canonical Situation v3
        env:
          REQUESTED_WEEK: ${{ github.event.inputs.week }}
        run: |
          WEEK="$REQUESTED_WEEK"
          if [ -z "$WEEK" ]; then WEEK=auto; fi
          Rscript canonical_situation_v3.R "$WEEK"
      - name: Read detected week
        id: detected
        run: echo "week=$(cat output_week.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: week${{ steps.detected.outputs.week }}-canonical-situation-v3
          path: |
            situation_v3_full/
            output_week.txt
          if-no-files-found: error
