name: Build pure yardage inputs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install packages
        run: |
          install.packages(c("nflreadr", "dplyr", "stringr"))
        shell: Rscript {0}

      - name: Build and audit pure yardage inputs
        run: Rscript build_pure_yardage_inputs.R

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pure-yardage-inputs-2025-through-2026-week3
          path: |
            pure_yardage_inputs_2025_2026w1-3.csv
            pure_yardage_dpi_audit_2025_2026w1-3.csv
            pure_yardage_scope_counts.csv
            GB_ATL_week3_pure_yardage_audit.csv
            pure_yardage_summary.txt
          retention-days: 30
