name: Convert Week 1 NFL PBP

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Convert and score Week 1
        run: Rscript convert_week.R 1

      - name: Upload exact Week 1 outputs
        uses: actions/upload-artifact@v4
        with:
          name: week1-exact-pbp
          path: |
            week1_exact_results.csv
            week1_results.js
            csv/
