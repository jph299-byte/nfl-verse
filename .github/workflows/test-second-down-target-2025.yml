name: 2025 second-down target A/B test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          install.packages("curl")
          install.packages(c("nflreadr", "dplyr", "stringr", "tidyr"), dependencies = TRUE)
          stopifnot(requireNamespace("nflreadr", quietly = TRUE))
          stopifnot(requireNamespace("dplyr", quietly = TRUE))
          stopifnot(requireNamespace("stringr", quietly = TRUE))
          stopifnot(requireNamespace("tidyr", quietly = TRUE))

      - name: Run second-down target A/B test
        run: Rscript test_second_down_target_2025_AB.R

      - name: Upload A/B test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: second-down-target-2025-AB-results
          path: |
            second_down_target_model_comparison.csv
            second_down_target_fold_results.csv
            second_down_target_play_impact.csv
            second_down_target_sequential_predictions.csv
            second_down_target_sequential_summary.csv
            second_down_target_sequential_windows.csv
            second_down_target_AB_summary.csv
          if-no-files-found: warn
