name: Calibrate 2025 Situational Model

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Run 2025 calibration
        run: Rscript calibrate_2025.R

      - name: Upload calibration outputs
        uses: actions/upload-artifact@v4
        with:
          name: nfl-numbers-2025-calibration
          path: |
            calibration_2025/calibration_summary.txt
            calibration_2025/team_game_calibration.csv
            calibration_2025/out_of_sample_weeks13_18.csv
          if-no-files-found: error
          retention-days: 90
