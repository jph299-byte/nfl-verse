name: Final canonical second-down A/B test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          install.packages("curl")
          install.packages(c("nflreadr", "dplyr", "stringr"), dependencies = TRUE)
          stopifnot(requireNamespace("nflreadr", quietly = TRUE))
          stopifnot(requireNamespace("dplyr", quietly = TRUE))
          stopifnot(requireNamespace("stringr", quietly = TRUE))

      - name: Run final canonical A/B test
        run: Rscript test_canonical_second_down_target_AB.R

      - name: Upload canonical A/B results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-second-down-AB-results
          path: canonical_second_down_AB/
          if-no-files-found: error
